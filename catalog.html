<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Каталог фільмів</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav>
        <a href="index.html">Головна</a> <strong style="color: aliceblue;">Каталог</strong> <a href="trailers.html">Трейлери</a> <a
            href="contacts.html">Контакти</a>
    </nav>

    <h1>Повний список фільмів</h1>

    <table class="table-style">

        <thead>
            <tr>
                <th>№</th>
                <th>Назва</th>
                <th>Жанр</th>
                <th>Рік</th>
                <th>Рейтинг</th>
                <th>Дія</th>
            </tr>
        </thead>
        <tbody id="movies-list">
            
        </tbody>
    </table>
</body>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch('http://localhost:3000/api/movies');
            const movies = await response.json();
            const tbody = document.getElementById('movies-list');

            movies.forEach((movie, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td><b>${movie.title}</b></td>
                        <td>${movie.genre}</td>
                        <td>${movie.release_year}</td>
                        <td>${movie.rating}</td>
                        <td><a href="movie-details.html?id=${movie.id}">Переглянути</a></td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Помилка завантаження фільмів:", error);
        }
    });
</script>
</html>
